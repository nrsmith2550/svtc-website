# One-time helper: copies the original photos from silentvictorytc.com into img/uploads
# so the site no longer depends on the old website. Safe to re-run; skips files already present.
name: Import original photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/import-photos.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        run: |
          mkdir -p img/uploads
          for f in logo.png facility.jpg people.jpg slides/Slide1.jpg slides/Slide2.jpg slides/social.jpg \
                   wrestling.jpg jiujitsu1.jpg service2.png teamshane.jpg training.jpg recovery.jpg; do
            out="img/uploads/$(basename "$f")"
            [ -s "$out" ] || curl -fsSL --retry 3 "https://www.silentvictorytc.com/img/$f" -o "$out"
            file "$out"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/uploads
          git diff --cached --quiet || git commit -m "Import original photos into img/uploads"
          git push
